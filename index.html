<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0f7a6b; --teal-dark:#0b6558; --teal-soft:#e6f3ef;
    --ink:#10302b; --muted:#6b7f7a; --line:#e3ebe9; --bg:#f3f7f6; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#ececec; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .app{
    display:flex; width:min(1100px,100vw); height:min(760px,100vh); background:var(--bg);
    border-radius:10px; overflow:hidden; box-shadow:0 6px 30px rgba(0,0,0,.12);
  }

  /* ---------- sidebar ---------- */
  .side{width:222px; flex:none; background:#fff; border-right:1px solid var(--line);
        display:flex; flex-direction:column; padding:18px 14px 14px}
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px 16px; font-weight:700; font-size:17px}
  .logo{width:34px; height:34px; border-radius:9px; background:var(--teal); display:grid; place-items:center}
  .logo svg{width:20px; height:20px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .newchat{
    width:100%; border:0; background:var(--teal); color:#fff; font:inherit; font-weight:600; font-size:14px;
    padding:12px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .newchat:hover{background:var(--teal-dark)}
  .label{font-size:11px; letter-spacing:.09em; color:var(--muted); font-weight:600; margin:22px 6px 8px}
  .topics{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; padding-right:2px}
  .topic{
    display:flex; align-items:center; gap:12px; padding:9px 10px; border:0; background:transparent;
    border-radius:10px; font:inherit; font-size:14px; font-weight:500; color:var(--ink); cursor:pointer; text-align:left;
  }
  .topic:hover{background:#f1f6f4}
  .topic.active{background:var(--teal-soft)}
  .ticon{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:15px; flex:none}
  .note{
    margin-top:12px; background:var(--teal-soft); border-radius:10px; padding:12px; font-size:12px;
    line-height:1.45; display:flex; gap:10px; color:#1d4b43
  }
  .note svg{width:18px; height:18px; flex:none; fill:none; stroke:var(--teal); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; margin-top:1px}

  /* ---------- main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0}
  .head{padding:18px 28px 14px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  .head h1{margin:0; font-size:19px; font-weight:700}
  .head p{margin:3px 0 0; font-size:12.5px; color:var(--muted)}
  .pill{
    border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font:inherit; font-size:12px;
    font-weight:600; display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--ink); white-space:nowrap;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:#22b573}
  .pill.off .dot{background:#b5c0bd}

  .messages{flex:1; overflow-y:auto; padding:18px 28px; display:flex; flex-direction:column; gap:16px}
  .row{display:flex; gap:12px; align-items:flex-start}
  .row.user{justify-content:flex-end}
  .bubble{background:var(--teal); color:#fff; font-weight:600; font-size:14px; padding:12px 18px; border-radius:16px 16px 4px 16px; max-width:70%}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--teal-soft); display:grid; place-items:center; flex:none}
  .avatar svg{width:17px; height:17px; fill:none; stroke:var(--teal); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .col{max-width:calc(100% - 46px); min-width:0}
  .card{background:#fff; border:1px solid var(--line); border-radius:6px 16px 16px 16px; padding:15px 18px; font-size:14px; line-height:1.55}
  .card p{margin:0 0 8px}
  .card p:last-child{margin-bottom:0}
  .card p:first-child strong, .card b{font-weight:700}
  .card ul{list-style:none; padding:0; margin:6px 0 10px}
  .card li{position:relative; padding:6px 0 6px 22px}
  .card li::before{content:""; position:absolute; left:2px; top:14px; width:7px; height:7px; border-radius:50%; background:#2f66d0}
  .card li:nth-child(4n+2)::before{background:#d02f4f}
  .card li:nth-child(4n+3)::before{background:#7a3fd0}
  .card li:nth-child(4n+4)::before{background:#d0561f}
  .cite{color:var(--muted); font-size:12.5px}

  .sources, .follow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .no-sources .sources{display:none}
  .chip{
    display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 6px; border-radius:999px; text-decoration:none;
    font-size:12px; font-weight:600
  }
  .chip .num{width:20px; height:20px; border-radius:50%; color:#fff; display:grid; place-items:center; font-size:11px}
  .org-MedlinePlus{background:#dce8fb; color:#17479a} .org-MedlinePlus .num{background:#1f5fc9}
  .org-NHS{background:#d8efe2; color:#0b6a3a} .org-NHS .num{background:#12823f}
  .org-WHO{background:#fde3d8; color:#a8360b} .org-WHO .num{background:#cc4a14}
  .org-CDC{background:#ece3fa; color:#552a9e} .org-CDC .num{background:#6f3fc4}
  .org-other{background:#e8eeed; color:#33504a} .org-other .num{background:#5b7570}
  .sug{
    border:1px solid #cfdcd9; background:#fff; border-radius:999px; padding:8px 15px; font:inherit; font-size:12.5px;
    font-weight:600; color:var(--teal); cursor:pointer
  }
  .sug:hover{background:var(--teal-soft)}

  .welcome{margin:auto; text-align:center; max-width:520px}
  .welcome .logo{margin:0 auto 14px; width:48px; height:48px; border-radius:13px}
  .welcome .logo svg{width:27px; height:27px}
  .welcome h2{margin:0 0 6px; font-size:21px}
  .welcome p{margin:0 0 16px; color:var(--muted); font-size:13.5px}
  .welcome .follow{justify-content:center}

  .typing{display:flex; gap:5px; padding:6px 2px}
  .typing span{width:7px; height:7px; border-radius:50%; background:#9bb3ae; animation:b 1.1s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}

  /* ---------- input ---------- */
  .inputwrap{padding:8px 28px 12px}
  .input{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:8px 8px 8px 18px;
    display:flex; align-items:center; gap:8px
  }
  .input:focus-within{border-color:#9fcfc5; box-shadow:0 0 0 3px rgba(15,122,107,.1)}
  .input input{flex:1; border:0; outline:0; font:inherit; font-size:14px; background:transparent; color:var(--ink); min-width:0}
  .input input::placeholder{color:#97a7a3}
  .ibtn{width:38px; height:38px; border-radius:10px; border:0; cursor:pointer; display:grid; place-items:center}
  .ibtn svg{width:18px; height:18px; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .mic{background:var(--teal-soft)} .mic svg{stroke:var(--teal)}
  .mic.rec{background:#fde3e3} .mic.rec svg{stroke:#d02f2f}
  .send{background:var(--teal); width:42px} .send svg{stroke:#fff}
  .send:hover{background:var(--teal-dark)}
  .send:disabled{opacity:.5; cursor:default}
  .disc{text-align:center; font-size:11px; color:var(--muted); margin:9px 0 0}

  @media (max-width:760px){
    .side{display:none}
    .app{border-radius:0}
    .head, .messages, .inputwrap{padding-left:16px; padding-right:16px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      CareChat
    </div>
    <button class="newchat" id="newChat"><span style="font-size:18px;line-height:1">+</span> New chat</button>
    <div class="label">TOPICS</div>
    <div class="topics" id="topics"></div>
    <div class="note">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      <span id="noteText">Answers come only from trusted health pages.</span>
    </div>
  </aside>

  <section class="main">
    <header class="head">
      <div>
        <h1>Ask about your health</h1>
        <p>Every answer is cited from trusted sources</p>
      </div>
      <button class="pill" id="srcToggle" title="Show or hide source chips"><span class="dot"></span><span id="srcLabel">Sources on</span></button>
    </header>

    <div class="messages" id="messages"></div>

    <div class="inputwrap">
      <form class="input" id="form" autocomplete="off">
        <input id="q" type="text" placeholder="Ask a health question..." maxlength="500">
        <button type="button" class="ibtn mic" id="mic" title="Speak your question">
          <svg viewBox="0 0 24 24" stroke="currentColor"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button type="submit" class="ibtn send" id="send" title="Send">
          <svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <p class="disc" id="disc">General health information, not a diagnosis. Please consult a doctor for medical advice.</p>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const messages = $("#messages"), form = $("#form"), qInput = $("#q"), sendBtn = $("#send");
const HEART = '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';

let INFO = {topics: [], orgs: [], disclaimer: ""};
let history = [];     // [[user, assistant], ...] sent back to the server for follow-up questions
let busy = false;

/* ---------- small helpers ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  return s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
          .replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
}
function md(text){
  let html = "", inList = false;
  for (const line of esc(text).split("\n")) {
    const m = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if (m) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inline(m[1]) + "</li>";
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (line.trim()) html += "<p>" + inline(line) + "</p>";
    }
  }
  if (inList) html += "</ul>";
  return html;
}
function scrollDown(){ messages.scrollTop = messages.scrollHeight; }
function orgClass(org){ return ["MedlinePlus","NHS","WHO","CDC"].includes(org) ? "org-" + org : "org-other"; }

/* ---------- rendering ---------- */
function showWelcome(){
  messages.innerHTML = "";
  const w = document.createElement("div");
  w.className = "welcome";
  w.innerHTML = '<div class="logo">' + HEART + '</div><h2>How can I help today?</h2>' +
                '<p>Ask a health question and I will answer from trusted public health pages, with sources.</p>';
  const f = document.createElement("div");
  f.className = "follow";
  INFO.topics.slice(0, 4).forEach(t => {
    const b = document.createElement("button");
    b.className = "sug"; b.type = "button";
    b.textContent = "What are the symptoms of " + t.query + "?";
    b.onclick = () => send(b.textContent);
    f.appendChild(b);
  });
  w.appendChild(f);
  messages.appendChild(w);
}

function addUser(text){
  const r = document.createElement("div");
  r.className = "row user";
  r.innerHTML = '<div class="bubble"></div>';
  r.firstChild.textContent = text;
  messages.appendChild(r);
  scrollDown();
}

function addBotShell(){
  const r = document.createElement("div");
  r.className = "row";
  r.innerHTML = '<div class="avatar">' + HEART + '</div><div class="col"><div class="card"><div class="typing"><span></span><span></span><span></span></div></div></div>';
  messages.appendChild(r);
  scrollDown();
  return r.querySelector(".col");
}

function fillBot(col, data){
  col.querySelector(".card").innerHTML = md(data.answer);

  if (data.sources && data.sources.length) {
    const s = document.createElement("div");
    s.className = "sources";
    data.sources.forEach(src => {
      const a = document.createElement(src.url.startsWith("http") ? "a" : "span");
      a.className = "chip " + orgClass(src.org);
      if (a.tagName === "A") { a.href = src.url; a.target = "_blank"; a.rel = "noopener"; }
      a.title = src.heading;
      a.innerHTML = '<span class="num">' + src.n + '</span>';
      a.appendChild(document.createTextNode(src.org + " · " + src.title.slice(0, 32)));
      s.appendChild(a);
    });
    col.appendChild(s);
  }
  if (data.followups && data.followups.length) {
    const f = document.createElement("div");
    f.className = "follow";
    data.followups.forEach(q => {
      const b = document.createElement("button");
      b.className = "sug"; b.type = "button"; b.textContent = q;
      b.onclick = () => send(q);
      f.appendChild(b);
    });
    col.appendChild(f);
  }
  scrollDown();
}

/* ---------- sending ---------- */
async function send(text){
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  const w = messages.querySelector(".welcome"); if (w) w.remove();

  addUser(text);
  qInput.value = "";
  const col = addBotShell();
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history: history.slice(-4)})
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    fillBot(col, data);
    history.push([text, data.answer]);
  } catch (e) {
    col.querySelector(".card").textContent = "Sorry, something went wrong. Check the terminal for errors and try again.";
  }
  busy = false; sendBtn.disabled = false; qInput.focus();
}

form.addEventListener("submit", e => { e.preventDefault(); send(qInput.value); });

/* ---------- sidebar ---------- */
function renderTopics(){
  const box = $("#topics"); box.innerHTML = "";
  INFO.topics.forEach(t => {
    const b = document.createElement("button");
    b.className = "topic"; b.type = "button";
    b.innerHTML = '<span class="ticon" style="background:' + t.tint + '">' + t.emoji + '</span><span></span>';
    b.lastChild.textContent = t.name;
    b.onclick = () => {
      document.querySelectorAll(".topic").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      send("What is " + t.query + "?");
    };
    box.appendChild(b);
  });
}

$("#newChat").onclick = () => {
  history = [];
  document.querySelectorAll(".topic").forEach(x => x.classList.remove("active"));
  showWelcome(); qInput.focus();
};

$("#srcToggle").onclick = () => {
  const off = $("#srcToggle").classList.toggle("off");
  messages.classList.toggle("no-sources", off);
  $("#srcLabel").textContent = off ? "Sources off" : "Sources on";
};

/* ---------- microphone (Chrome / Edge) ---------- */
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#mic");
  if (!SR) { mic.style.display = "none"; return; }
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false;
  rec.onresult = e => { qInput.value = e.results[0][0].transcript; };
  rec.onend = () => mic.classList.remove("rec");
  rec.onerror = () => mic.classList.remove("rec");
  mic.onclick = () => {
    if (mic.classList.contains("rec")) { rec.stop(); return; }
    mic.classList.add("rec");
    try { rec.start(); } catch (e) { mic.classList.remove("rec"); }
  };
})();

/* ---------- start ---------- */
fetch("/api/info").then(r => r.json()).then(info => {
  INFO = info;
  renderTopics();
  const orgs = info.orgs.length > 1
    ? info.orgs.slice(0, -1).join(", ") + " and " + info.orgs[info.orgs.length - 1]
    : info.orgs.join("");
  $("#noteText").textContent = "Answers come only from " + orgs + " pages.";
  if (info.disclaimer) $("#disc").textContent = info.disclaimer;
  showWelcome();
}).catch(() => { messages.textContent = "Could not reach the server. Is carechat.py running?"; });
</script>
</body>
</html>
